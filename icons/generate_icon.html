<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Générateur d'icônes PWA</title>
    <style>
        body { font-family: system-ui; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #10b981; }
        canvas { border: 2px solid #e5e7eb; border-radius: 8px; margin: 10px; }
        button { background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px 5px; }
        button:hover { background: #059669; }
        .preview { display: flex; flex-wrap: wrap; gap: 20px; margin: 20px 0; }
        .icon-box { text-align: center; }
        .instructions { background: #f0fdf4; border-left: 4px solid #10b981; padding: 15px; margin: 20px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Générateur d'icônes PWA - Assistant Scolaire</h1>
        
        <div class="instructions">
            <strong>Instructions :</strong>
            <ol>
                <li>Cliquez sur "Générer les icônes" ci-dessous</li>
                <li>Cliquez sur chaque bouton "Télécharger" pour sauvegarder les icônes</li>
                <li>Placez les fichiers téléchargés dans le dossier <code>icons/</code></li>
            </ol>
        </div>

        <button onclick="generateIcons()">🎨 Générer les icônes</button>

        <div class="preview" id="preview"></div>
    </div>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;
            
            // Fond dégradé vert
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#10b981');
            gradient.addColorStop(1, '#059669');
            
            // Fond arrondi
            ctx.fillStyle = gradient;
            const radius = size * 0.22;
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, radius);
            ctx.fill();
            
            // Échelle pour les éléments
            const scale = size / 192;
            
            // Icône Bus (partie haute)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(48 * scale, 60 * scale, 80 * scale, 60 * scale, 8 * scale);
            ctx.fill();
            
            // Fenêtres du bus
            ctx.fillStyle = '#020617';
            ctx.beginPath();
            ctx.roundRect(64 * scale, 68 * scale, 28 * scale, 24 * scale, 4 * scale);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(100 * scale, 68 * scale, 28 * scale, 24 * scale, 4 * scale);
            ctx.fill();
            
            // Roues du bus
            ctx.beginPath();
            ctx.arc(72 * scale, 116 * scale, 6 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(120 * scale, 116 * scale, 6 * scale, 0, Math.PI * 2);
            ctx.fill();
            
            // Toit du bus
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(68 * scale, 48 * scale, 56 * scale, 16 * scale, 8 * scale);
            ctx.fill();
            
            // Icône Calendrier (partie basse)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(48 * scale, 128 * scale, 80 * scale, 72 * scale, 8 * scale);
            ctx.fill();
            
            // En-tête du calendrier
            ctx.fillStyle = '#020617';
            ctx.beginPath();
            ctx.roundRect(48 * scale, 128 * scale, 80 * scale, 20 * scale, 8 * scale);
            ctx.fill();
            
            // Anneaux du calendrier
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4 * scale;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(76 * scale, 128 * scale);
            ctx.lineTo(76 * scale, 120 * scale);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(116 * scale, 128 * scale);
            ctx.lineTo(116 * scale, 120 * scale);
            ctx.stroke();
            
            // Cases du calendrier
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.roundRect(64 * scale, 156 * scale, 16 * scale, 12 * scale, 2 * scale);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(2, 6, 23, 0.2)';
            ctx.beginPath();
            ctx.roundRect(88 * scale, 156 * scale, 16 * scale, 12 * scale, 2 * scale);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(112 * scale, 156 * scale, 16 * scale, 12 * scale, 2 * scale);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(64 * scale, 176 * scale, 16 * scale, 12 * scale, 2 * scale);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(88 * scale, 176 * scale, 16 * scale, 12 * scale, 2 * scale);
            ctx.fill();
        }

        function generateIcons() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            
            const sizes = [
                { size: 192, name: 'icon-192.png' },
                { size: 512, name: 'icon-512.png' }
            ];
            
            sizes.forEach(({ size, name }) => {
                const box = document.createElement('div');
                box.className = 'icon-box';
                
                const canvas = document.createElement('canvas');
                drawIcon(canvas, size);
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = `⬇️ Télécharger ${name}`;
                downloadBtn.onclick = () => {
                    const link = document.createElement('a');
                    link.download = name;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };
                
                const label = document.createElement('p');
                label.textContent = `${size}x${size}px`;
                label.style.margin = '10px 0';
                label.style.fontWeight = 'bold';
                
                box.appendChild(canvas);
                box.appendChild(label);
                box.appendChild(downloadBtn);
                preview.appendChild(box);
            });
        }
        
        // Générer automatiquement au chargement
        window.onload = generateIcons;
    </script>
</body>
</html>
