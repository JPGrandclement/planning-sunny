<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assistant Scolaire - Trajet & Planning</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Assistant scolaire pour consulter les horaires de bus et l'emploi du temps">
    <meta name="theme-color" content="#10b981">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mon Assistant">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Icônes pour iOS -->
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        hawk: { 400: '#34d399', 500: '#10b981', 600: '#059669', 900: '#064e3b', 950: '#022c22' },
                        ligne2: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a', 950: '#172554' }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -webkit-tap-highlight-color: transparent; }
        
        .glass-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .switch-toggle {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .tab-pane.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .current-class-glow {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.5);
        }

        .home-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .home-card:hover {
            transform: translateY(-4px);
        }
        .home-card:active {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="font-sans h-full flex flex-col antialiased selection:bg-hawk-500 selection:text-white relative">

    <!-- Header -->
    <header class="glass-header sticky top-0 z-40 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex-1">
                <h1 class="text-lg font-extrabold text-white leading-tight tracking-tight">Mon Assistant</h1>
                <div class="flex items-center gap-2 flex-wrap">
                    <p id="currentDateDisplay" class="text-xs font-medium text-slate-400 capitalize"></p>
                    
                    <!-- Current Week Badge -->
                    <span id="currentWeekBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-700/50 text-slate-300 border border-slate-600/30 uppercase tracking-wider">
                        Sem. A
                    </span>
                    
                    <!-- Displayed Week Badge with Dropdown -->
                    <div class="relative" id="displayedWeekContainer">
                        <button onclick="toggleWeekMenu()" id="weekIndicator" class="flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-hawk-500/20 text-hawk-400 border border-hawk-500/30 uppercase tracking-wider cursor-pointer hover:bg-hawk-500/30 transition">
                            <span id="weekModeIcon">🔄</span>
                            <span id="weekLabel">Semaine A</span>
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        
                        <!-- Dropdown Menu -->
                        <div id="weekMenu" class="hidden absolute top-full mt-1 right-0 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-50 min-w-[160px] overflow-hidden">
                            <button onclick="setWeekMode('auto')" class="w-full px-3 py-2 text-left text-xs hover:bg-slate-800 transition flex items-center justify-between text-slate-200">
                                <span>🔄 Auto</span>
                                <span id="autoCheck" class="text-hawk-400 font-bold"></span>
                            </button>
                            <button onclick="setWeekMode('forceA')" class="w-full px-3 py-2 text-left text-xs hover:bg-slate-800 transition flex items-center justify-between text-slate-200">
                                <span>📌 Forcer Semaine A</span>
                                <span id="forceACheck" class="text-hawk-400 font-bold"></span>
                            </button>
                            <button onclick="setWeekMode('forceB')" class="w-full px-3 py-2 text-left text-xs hover:bg-slate-800 transition flex items-center justify-between text-slate-200">
                                <span>📌 Forcer Semaine B</span>
                                <span id="forceBCheck" class="text-hawk-400 font-bold"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Time Simulator Button -->
            <button onclick="toggleSimulator()" class="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 hover:bg-slate-700 transition">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span id="simTimeDisplay" class="text-xs font-mono font-bold text-slate-200">--:--</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto pb-24">
        <div class="max-w-md mx-auto p-4">

            <!-- TAB 0 : ACCUEIL -->
            <div id="tab-home" class="tab-pane active">
                <div class="space-y-4 py-4">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-black text-white mb-2">Que veux-tu consulter ?</h2>
                        <p class="text-sm text-slate-400">Choisis une section pour commencer</p>
                    </div>

                    <!-- Carte Bus -->
                    <button onclick="switchTab('bus')" class="w-full home-card">
                        <div class="bg-gradient-to-br from-hawk-900 to-hawk-950 border-2 border-hawk-600 rounded-3xl p-6 shadow-xl shadow-hawk-500/10">
                            <div class="flex items-center justify-between mb-4">
                                <div class="p-3 bg-hawk-500/20 rounded-2xl">
                                    <svg class="w-8 h-8 text-hawk-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                                    </svg>
                                </div>
                                <svg class="w-6 h-6 text-hawk-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </div>
                            <h3 class="text-2xl font-black text-white mb-2">Horaires Bus</h3>
                            <p class="text-sm text-hawk-300 mb-3">Consulte les horaires HAWK 3 et Ligne 2</p>
                            <div id="homeNextBusPreview" class="text-xs text-hawk-400 font-semibold">
                                <!-- Populated dynamically -->
                            </div>
                        </div>
                    </button>

                    <!-- Carte Planning -->
                    <button onclick="switchTab('planning')" class="w-full home-card">
                        <div class="bg-gradient-to-br from-slate-800 to-slate-900 border-2 border-slate-700 rounded-3xl p-6 shadow-xl">
                            <div class="flex items-center justify-between mb-4">
                                <div class="p-3 bg-slate-700/50 rounded-2xl">
                                    <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                    </svg>
                                </div>
                                <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </div>
                            <h3 class="text-2xl font-black text-white mb-2">Emploi du temps</h3>
                            <p class="text-sm text-slate-400 mb-3">Ton planning de la semaine</p>
                            <div id="homeNextClassPreview" class="text-xs text-slate-400 font-semibold">
                                <!-- Populated dynamically -->
                            </div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- TAB 1 : BUS & TRAJETS -->
            <div id="tab-bus" class="tab-pane space-y-5">
                
                <!-- Line Selector Toggle -->
                <div class="bg-slate-900 p-1.5 rounded-2xl border border-slate-800 flex relative shadow-inner">
                    <div id="lineSlider" class="absolute top-1.5 bottom-1.5 w-[calc(50%-6px)] bg-hawk-600 rounded-xl switch-toggle shadow-md"></div>
                    
                    <button onclick="setLine('hawk3')" id="btn-hawk3" class="relative z-10 w-1/2 py-2.5 text-sm font-bold rounded-xl transition-colors flex items-center justify-center gap-2 text-white">
                        <span class="bg-white/20 px-1.5 py-0.5 rounded text-[10px] uppercase">Principal</span>
                        HAWK 3
                    </button>
                    <button onclick="setLine('ligne2')" id="btn-ligne2" class="relative z-10 w-1/2 py-2.5 text-sm font-bold rounded-xl transition-colors flex items-center justify-center gap-2 text-slate-400">
                        Ligne 2
                        <span class="bg-slate-800 text-slate-400 px-1.5 py-0.5 rounded text-[10px] border border-slate-700 uppercase" id="badge-ligne2">Altern.</span>
                    </button>
                </div>

                <!-- Day Selector for Bus -->
                <div class="flex gap-2 overflow-x-auto pb-2">
                    <button onclick="setBusDay('today')" id="bus-day-today" class="bus-day-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all">
                        Aujourd'hui
                    </button>
                    <button onclick="setBusDay('tomorrow')" id="bus-day-tomorrow" class="bus-day-btn px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all">
                        Demain
                    </button>
                    <button onclick="setBusDay(1)" id="bus-day-1" class="bus-day-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all">Lu</button>
                    <button onclick="setBusDay(2)" id="bus-day-2" class="bus-day-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all">Ma</button>
                    <button onclick="setBusDay(3)" id="bus-day-3" class="bus-day-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all">Me</button>
                    <button onclick="setBusDay(4)" id="bus-day-4" class="bus-day-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all">Je</button>
                    <button onclick="setBusDay(5)" id="bus-day-5" class="bus-day-btn px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all">Ve</button>
                </div>

                <!-- Next Bus Widget -->
                <div id="nextBusWidget" class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-5 shadow-xl relative overflow-hidden">
                    <!-- Populated dynamically via JS -->
                </div>

                <!-- Direction Toggle (Aller / Retour) -->
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h3 class="text-sm font-bold text-slate-300">Horaires du jour</h3>
                    <div class="flex bg-slate-900 rounded-lg p-0.5 border border-slate-800">
                        <button onclick="setDirection('aller')" id="dir-aller" class="px-3 py-1 text-xs font-bold rounded-md bg-slate-700 text-white">Aller</button>
                        <button onclick="setDirection('retour')" id="dir-retour" class="px-3 py-1 text-xs font-bold rounded-md text-slate-400 hover:text-white">Retour</button>
                    </div>
                </div>

                <!-- Today's Trips List -->
                <div id="busTimelineList" class="space-y-3">
                    <!-- Populated dynamically via JS -->
                </div>

            </div>

            <!-- TAB 2 : EMPLOI DU TEMPS -->
            <div id="tab-planning" class="tab-pane space-y-4">
                
                <!-- Day Selector -->
                <div class="flex justify-between gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button onclick="setPlanningDay(1)" id="day-1" class="day-btn flex-1 py-2 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-400 transition">Lu</button>
                    <button onclick="setPlanningDay(2)" id="day-2" class="day-btn flex-1 py-2 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-400 transition">Ma</button>
                    <button onclick="setPlanningDay(3)" id="day-3" class="day-btn flex-1 py-2 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-400 transition">Me</button>
                    <button onclick="setPlanningDay(4)" id="day-4" class="day-btn flex-1 py-2 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-400 transition">Je</button>
                    <button onclick="setPlanningDay(5)" id="day-5" class="day-btn flex-1 py-2 rounded-xl text-xs font-bold border border-slate-800 bg-slate-900 text-slate-400 transition">Ve</button>
                </div>

                <div class="flex justify-between items-center px-1">
                    <h2 class="text-sm font-bold text-white">Emploi du temps</h2>
                    <span id="planningDayLabel" class="text-xs text-hawk-400 font-medium">Lundi</span>
                </div>

                <!-- Schedule List -->
                <div id="scheduleContainer" class="space-y-3 relative before:absolute before:inset-y-0 before:left-[43px] before:w-px before:bg-slate-800">
                    <!-- Populated dynamically via JS -->
                </div>

            </div>

        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 pb-safe pt-2 px-6 z-40">
        <div class="max-w-md mx-auto flex justify-around pb-4">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-hawk-500 w-20 transition-colors">
                <div class="p-1.5 rounded-full bg-hawk-500/10 mb-0.5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                </div>
                <span class="text-[10px] font-bold">Accueil</span>
            </button>
            <button onclick="switchTab('bus')" id="nav-bus" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 w-20 transition-colors">
                <div class="p-1.5 rounded-full mb-0.5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                </div>
                <span class="text-[10px] font-bold">Bus</span>
            </button>
            <button onclick="switchTab('planning')" id="nav-planning" class="flex flex-col items-center gap-1 text-slate-500 hover:text-slate-300 w-20 transition-colors">
                <div class="p-1.5 rounded-full mb-0.5">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <span class="text-[10px] font-bold">Planning</span>
            </button>
        </div>
    </nav>

    <!-- Simulator Modal -->
    <div id="simulatorModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl relative">
            <h3 class="text-sm font-bold text-white mb-4">Simulateur de Temps</h3>
            <p class="text-xs text-slate-400 mb-4">Modifie l'heure ou le jour pour tester le fonctionnement de l'assistant.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Heure de la journée</label>
                    <input type="time" id="timeInput" class="w-full bg-slate-950 text-white font-mono border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-hawk-500">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Forcer le jour</label>
                    <select id="dayInput" class="w-full bg-slate-950 text-white text-sm border border-slate-700 rounded-xl px-3 py-2 focus:outline-none focus:border-hawk-500">
                        <option value="1">Lundi</option>
                        <option value="2">Mardi</option>
                        <option value="3">Mercredi</option>
                        <option value="4">Jeudi</option>
                        <option value="5">Vendredi</option>
                    </select>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button onclick="toggleSimulator()" class="flex-1 py-2.5 rounded-xl border border-slate-700 text-slate-300 text-sm font-semibold hover:bg-slate-800">Annuler</button>
                <button onclick="applySimulation()" class="flex-1 py-2.5 rounded-xl bg-hawk-600 text-white text-sm font-bold hover:bg-hawk-500 shadow-lg shadow-hawk-500/20">Appliquer</button>
            </div>
            
            <button onclick="resetSimulation()" class="w-full mt-3 py-2 text-xs text-slate-400 hover:text-white flex items-center justify-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Revenir au temps réel
            </button>
        </div>
    </div>

        // Parse URL parameters for deep linking
        function parseURLParams() {
            const params = new URLSearchParams(window.location.search);
            const view = params.get('view');

        function initTime() {
            const now = STATE.realDate;
            let day = now.getDay();
            
            // Ne pas forcer le jour à lundi si on est samedi/dimanche
            // On garde le jour réel pour les comparaisons
            STATE.simulatedDay = day;
            
            const hours = now.getHours();
            if (hours >= 12 && hours < 20) {
                STATE.activeDir = 'retour';
            } else {
                STATE.activeDir = 'aller';
            }
        }

        function getCurrentDay() {
            // Retourner le jour réel, même si c'est samedi (6) ou dimanche (0)
            return STATE.simulatedDay !== null ? STATE.simulatedDay : STATE.realDate.getDay();
        }
        function getCurrentTime() {
            if (STATE.simulatedTime) return STATE.simulatedTime;
            const now = STATE.realDate;
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        function timeToMins(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        // Fonction pour calculer si on est en semaine A ou B
        function getCurrentWeek() {
            const now = STATE.realDate;
            const referenceDate = new Date(WEEK_A_REFERENCE);
            
            // Calculer le nombre de semaines écoulées depuis la date de référence
            const diffTime = now - referenceDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);
            
            // Alterner entre semaine A (pair) et semaine B (impair)
            return diffWeeks % 2 === 0 ? 'A' : 'B';
        }

        // Fonction pour calculer la semaine d'un jour spécifique
        function getWeekForDay(dayOfWeek) {
            const currentDay = getCurrentDay();
            
            // Si on est le weekend (samedi=6, dimanche=0) et qu'on regarde un jour de semaine
            if ((currentDay === 0 || currentDay === 6) && dayOfWeek >= 1 && dayOfWeek <= 5) {
                // Calculer la date du jour demandé de la semaine suivante
                const targetDate = new Date(STATE.realDate);
                let daysToAdd;
                
                if (currentDay === 0) { // Dimanche
                    daysToAdd = dayOfWeek; // Lundi=1, Mardi=2, etc.
                } else { // Samedi
                    daysToAdd = dayOfWeek + 2; // +2 pour passer dimanche et arriver au jour
                }
                
                targetDate.setDate(targetDate.getDate() + daysToAdd);
                
                // Calculer la semaine de cette date
                const referenceDate = new Date(WEEK_A_REFERENCE);
                const diffTime = targetDate - referenceDate;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const diffWeeks = Math.floor(diffDays / 7);
                
                return diffWeeks % 2 === 0 ? 'A' : 'B';
            }
            
            // Sinon, retourner la semaine actuelle
            return getCurrentWeek();
        }

        // Fonction pour obtenir la semaine à afficher selon le mode
        function getDisplayedWeek() {
            // Si mode manuel, retourner la semaine forcée
            if (STATE.weekMode === 'forceA') return 'A';
            if (STATE.weekMode === 'forceB') return 'B';
            
            // Mode auto : calculer selon le contexte
            if (STATE.activeTab === 'planning' && STATE.selectedPlanningDay) {
                // Calculer la semaine du jour sélectionné
                return getWeekForDay(STATE.selectedPlanningDay);
            }
            
            // Par défaut : semaine actuelle
            return getCurrentWeek();
        }

        function getNextWeekday(day) {
            if (day === 5) return 1; // Vendredi -> Lundi
            return day + 1;
        }

        // Get the day to display for bus schedules
        function getBusDisplayDay() {
            if (STATE.selectedBusDay === 'today') return getCurrentDay();
            if (STATE.selectedBusDay === 'tomorrow') return getNextWeekday(getCurrentDay());
            if (STATE.selectedBusDay >= 1 && STATE.selectedBusDay <= 5) return STATE.selectedBusDay;
            
            // Auto mode: check if we should suggest tomorrow
            const currentDay = getCurrentDay();
            const currentTime = getCurrentTime();
            const currentMins = timeToMins(currentTime);
            
            // After 17:00, check if there are more buses today
            if (currentMins > 1020) { // 17h = 1020 minutes
                const lineData = BUS_DATA[STATE.activeLine];
                const dirData = lineData[STATE.activeDir];
                const todayTrips = dirData.trips.filter(t => t.days.includes(currentDay));
                const hasMoreTrips = todayTrips.some(t => timeToMins(t.dep) > currentMins);
                
                if (!hasMoreTrips) {
                    return getNextWeekday(currentDay);
                }
            }
            
            return currentDay;
        }

            if (STATE.selectedPlanningDay) return STATE.selectedPlanningDay;
            
            const currentDay = getCurrentDay();
            // Si on est le weekend (samedi=6 ou dimanche=0), afficher le lundi par défaut
            if (currentDay === 0 || currentDay === 6) {
                return 1; // Lundi
            }
            
            return currentDay;
        }

        function renderNextBusWidget(trip, currentMins, dirData, theme, displayDay, isFutureDay = false) {

            const isTomorrow = displayDay !== currentDay && !isFutureDay;

                    </div>
                `;
                return;
            }

            const depMins = timeToMins(trip.dep);
            let timeText = '';
            let dayBadge = '';
            
            if (isFutureDay) {
                // Pour un jour futur, afficher juste l'horaire sans calcul de temps restant
                dayBadge = `<span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 mb-2 uppercase tracking-wider">${DAYS_NAME[displayDay]}</span>`;

            } else {
                // Pour aujourd'hui ou demain, calculer le temps restant
                const diff = isTomorrow ? (1440 - currentMins + depMins) : (depMins - currentMins);
                const hrsLeft = Math.floor(diff / 60);
                const minsLeft = diff % 60;
                
                if (hrsLeft > 0) timeText += `<span class="text-2xl">${hrsLeft}</span><span class="text-sm font-medium opacity-80">h </span>`;
                timeText += `<span class="text-4xl">${minsLeft}</span><span class="text-base font-medium opacity-80">min</span>`;

                if (isTomorrow) {
                    dayBadge = `<span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 mb-2 uppercase tracking-wider">Demain - ${DAYS_NAME[displayDay]}</span>`;
                }
            }

            container.innerHTML = `
                <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
                    <svg class="w-24 h-24 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>
                </div>

                ${dayBadge}

                <span class="inline-flex items-center gap-1.5 text-[10px] font-bold px-2 py-0.5 rounded-full ${bgLightTheme} ${textTheme} border ${borderTheme} mb-3 uppercase tracking-wider relative z-10">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full ${bgTheme} opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 ${bgTheme}"></span>
                    </span>
                    Prochain Départ
                </span>

                <div class="flex items-end justify-between relative z-10">
                    <div>
                        <div class="text-[11px] text-slate-400 font-semibold mb-0.5">Depuis ${dirData.from}</div>
                        <div class="text-5xl font-black text-white tracking-tighter">${trip.dep}</div>
                    </div>
                    <div class="text-right pb-1 ${textTheme}">
                        <div class="font-black leading-none">${timeText}</div>
                    </div>
                </div>
                
                <div class="mt-4 bg-slate-950/60 rounded-xl p-3 border border-slate-800 flex items-center justify-between backdrop-blur-md relative z-10">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-slate-400"></div>
                        <span class="text-xs text-slate-300">Arrivée à ${dirData.to}</span>
                    </div>
                    <span class="text-sm font-bold text-slate-200">${trip.arr}</span>
                </div>
            `;
        }

        function renderBusTimeline(trips, nextTripIndex, theme, currentMins, isFutureDay = false) {
            const container = document.getElementById('busTimelineList');
            container.innerHTML = '';
            
            if (trips.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-500 text-center py-4 border border-slate-800 border-dashed rounded-xl">Aucun trajet ce jour-ci.</p>`;
                return;
            }

            const textTheme = theme === 'hawk' ? 'text-hawk-400' : 'text-ligne2-400';
            const borderActiveTheme = theme === 'hawk' ? 'border-hawk-500/50' : 'border-ligne2-500/50';
            const bgActiveTheme = theme === 'hawk' ? 'bg-hawk-900/20' : 'bg-ligne2-900/20';
            const shadowTheme = theme === 'hawk' ? 'shadow-hawk-500/10' : 'shadow-ligne2-500/10';

            trips.forEach((trip, idx) => {
                const isNext = idx === nextTripIndex;
                // Pour un jour futur, aucun horaire n'est "passé"
                const isPast = isFutureDay ? false : timeToMins(trip.dep) < currentMins;
                
                const card = document.createElement('div');
                card.className = `p-3.5 rounded-2xl border transition-all flex items-center justify-between ${
                    isNext ? `${bgActiveTheme} ${borderActiveTheme} shadow-md ${shadowTheme}` :
                    isPast ? 'bg-slate-900/30 border-slate-800/50 opacity-50' :
                    'bg-slate-900 border-slate-800'
                }`;

                let extraHtml = '';
                if (isNext) {
                    extraHtml = `<span class="text-[9px] uppercase tracking-wider font-bold ${textTheme} border border-current px-1.5 py-0.5 rounded">Prochain</span>`;
                } else if (trip.highlight) {
                    extraHtml = `<span class="text-[9px] font-bold text-amber-500 border border-amber-500/30 px-1.5 py-0.5 rounded bg-amber-500/10">${trip.highlight}</span>`;
                } else if (trip.note) {
                    extraHtml = `<span class="text-[9px] text-slate-500">${trip.note}</span>`;
                }

                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="text-center w-12">
                            <span class="block text-lg font-black ${isNext ? textTheme : (isPast ? 'text-slate-500' : 'text-slate-200')}">${trip.dep}</span>
                        </div>
                        <div class="flex flex-col items-center justify-center">
                            <div class="w-1.5 h-1.5 rounded-full ${isNext ? 'bg-slate-400' : 'bg-slate-700'}"></div>
                            <div class="w-0.5 h-3 bg-slate-800 my-0.5"></div>
                            <div class="w-1.5 h-1.5 rounded-full ${isNext ? 'bg-slate-400' : 'bg-slate-700'}"></div>
                        </div>
                        <div class="text-center w-12">
                            <span class="block text-sm font-bold ${isNext ? 'text-slate-200' : (isPast ? 'text-slate-600' : 'text-slate-400')}">${trip.arr}</span>
                        </div>
                    </div>
                    <div>${extraHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        function updatePlanningTab() {
            const day = getPlanningDisplayDay();
            const currentMins = timeToMins(getCurrentTime());
            const displayedWeek = getDisplayedWeek();
            
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.remove('bg-hawk-600', 'text-white', 'border-hawk-500');
                btn.classList.add('bg-slate-900', 'text-slate-400', 'border-slate-800');
            });
            const activeDayBtn = document.getElementById(`day-${day}`);
            if(activeDayBtn) {
                activeDayBtn.classList.remove('bg-slate-900', 'text-slate-400', 'border-slate-800');
                activeDayBtn.classList.add('bg-hawk-600', 'text-white', 'border-hawk-500');
            }

            document.getElementById('planningDayLabel').innerText = DAYS_NAME[day];

            const schedule = PLANNING[day] || [];
            // Filtrer les cours selon la semaine A/B
            const filteredSchedule = schedule.filter(cls => cls.week === 'both' || cls.week === displayedWeek);
            
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            if (filteredSchedule.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-500 text-center py-10">Pas de cours ce jour.</p>`;
                return;
            }

            filteredSchedule.forEach((cls) => {
                const startMins = timeToMins(cls.start);
                const endMins = timeToMins(cls.end);
                
                const isCurrent = currentMins >= startMins && currentMins < endMins && day === getCurrentDay();
                const isPast = currentMins >= endMins && day === getCurrentDay();

                const colorMap = {
                    'blue': 'text-blue-400',
                    'rose': 'text-rose-400',
                    'amber': 'text-amber-400',
                    'purple': 'text-purple-400',
                    'emerald': 'text-emerald-400',
                    'orange': 'text-orange-400',
                    'pink': 'text-pink-400',
                    'indigo': 'text-indigo-400',
                    'slate': 'text-slate-400'
                };
                const classColor = colorMap[cls.color] || 'text-white';

                const div = document.createElement('div');
                div.className = `flex relative pl-14 py-1 transition-opacity ${isPast ? 'opacity-40' : 'opacity-100'}`;
                
                const dotClass = isCurrent ? 'bg-hawk-400 shadow-[0_0_10px_rgba(52,211,153,0.8)] border-slate-950 scale-125' : (isPast ? 'bg-slate-700 border-slate-950' : 'bg-slate-500 border-slate-950');
                
                let cardClass = `flex-1 p-3 rounded-2xl border transition-all ${cls.break ? 'bg-slate-900/50 border-slate-800/50 border-dashed' : 'bg-slate-900 border-slate-800'}`;
                if (isCurrent) {
                    cardClass += ' current-class-glow bg-slate-800/80';
                }

                // Afficher le professeur si disponible
                const teacherInfo = cls.teacher ? `<span class="text-[10px] text-slate-500 ml-1">${cls.teacher}</span>` : '';

                div.innerHTML = `
                    <div class="absolute left-0 top-3 w-10 text-right pr-2">
                        <span class="block text-xs font-bold ${isCurrent ? 'text-hawk-400' : 'text-slate-300'}">${cls.start}</span>
                        <span class="block text-[10px] text-slate-500">${cls.end}</span>
                    </div>
                    
                    <div class="absolute left-[39px] top-4 w-2 h-2 rounded-full border-2 ${dotClass} z-10 transition-transform"></div>
                    
                    <div class="${cardClass}">
                        <div class="flex justify-between items-start mb-1">
                            <div class="flex-1">
                                <h4 class="text-sm font-bold ${cls.break ? 'text-slate-400' : classColor}">${cls.subject}</h4>
                                ${teacherInfo}
                            </div>
                            ${isCurrent ? '<span class="text-[9px] uppercase tracking-wider font-bold bg-hawk-500/20 text-hawk-400 px-1.5 py-0.5 rounded">En cours</span>' : ''}
                        </div>
                        <div class="flex items-center gap-1">
                            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span class="text-xs text-slate-400 font-medium">${cls.room}</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // SIMULATOR
        function toggleSimulator() {
            const modal = document.getElementById('simulatorModal');
            if (modal.classList.contains('hidden')) {
                document.getElementById('timeInput').value = getCurrentTime();
                document.getElementById('dayInput').value = getCurrentDay();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function applySimulation() {
            const timeVal = document.getElementById('timeInput').value;
            const dayVal = document.getElementById('dayInput').value;
            
            if (timeVal) STATE.simulatedTime = timeVal;
            if (dayVal) STATE.simulatedDay = parseInt(dayVal);
            
            updateUI();
            toggleSimulator();
        }

        function resetSimulation() {
            STATE.simulatedTime = null;
            STATE.realDate = new Date();
            initTime();
            updateUI();
            toggleSimulator();
        }

        // --- PWA: ENREGISTREMENT DU SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('✅ Service Worker enregistré avec succès:', registration.scope);
                        
                        // Vérifier les mises à jour
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('🔄 Nouvelle version disponible');
                                    // Optionnel: afficher une notification à l'utilisateur
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.log('❌ Échec de l\'enregistrement du Service Worker:', error);
                    });
            });
        }

        // Gestion de l'installation PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('💡 L\'application peut être installée');
            // Vous pouvez afficher un bouton d'installation personnalisé ici
        });

        window.addEventListener('appinstalled', () => {
            console.log('✅ Application installée avec succès');
            deferredPrompt = null;
        });

    </script>
</body>
</html>
